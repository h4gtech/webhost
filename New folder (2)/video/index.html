<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Ad Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      height: 100%;
      width: 100%;
    }
    video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      /* Use contain to preserve aspect ratio and avoid cropping */
      width: auto;
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
    /* Fullscreen start overlay styling */
    #startOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 1.8rem;
      text-align: center;
      z-index: 9999;
      cursor: pointer;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <video id="adVideo" muted playsinline preload="auto" controls></video>

  <!-- Fullscreen start overlay: user must interact to enter fullscreen on most browsers -->
  <div id="startOverlay">Tap or click anywhere to start (will enter fullscreen)</div>

  <script>
    // List of ad videos (local files in the same folder)
    const videoList = [
      "video.mp4",
      "video1.mp4",
      "video2.mp4",
      "video3.mp4",
      "video4.mp4"
    ];

  let currentVideo = 0;
  const videoPlayer = document.getElementById("adVideo");
  const startOverlay = document.getElementById('startOverlay');
  let started = false;

    function playNext() {
      videoPlayer.src = videoList[currentVideo];
      // play() returns a promise; browsers may block play without user gesture
      const p = videoPlayer.play();
      if (p && typeof p.catch === 'function') {
        p.catch(err => {
        // Play was likely blocked — log and continue; some browsers will block both autoplay and fullscreen
          console.log('Autoplay likely blocked:', err);
        });
      }
      currentVideo = (currentVideo + 1) % videoList.length;
    }

    // Play next video when one ends
    videoPlayer.addEventListener("ended", playNext);

    // Attempt to start playback now (may be blocked by browser)
    playNext();

    // Request fullscreen using the Fullscreen API with vendor fallbacks
    function enterFullscreen(elem) {
      elem = elem || document.documentElement;
      if (elem.requestFullscreen) return elem.requestFullscreen();
      if (elem.webkitRequestFullscreen) return elem.webkitRequestFullscreen();
      if (elem.mozRequestFullScreen) return elem.mozRequestFullScreen();
      if (elem.msRequestFullscreen) return elem.msRequestFullscreen();
      return Promise.reject(new Error('Fullscreen API is not supported'));
    }

    // Start playback and attempt to enter fullscreen on first user interaction
    function startPlaybackAndFullscreen() {
      if (started) return;
      started = true;
      startOverlay.style.display = 'none';
      // Ensure video is muted for autoplay compatibility
      videoPlayer.muted = true;
      // Start (or resume) playback
      playNext();
      // Try to enter fullscreen on the video element first
      enterFullscreen(videoPlayer).catch(() => {
        // Fallback: try the documentElement
        enterFullscreen(document.documentElement).catch(err => {
          console.log('Could not enter fullscreen automatically:', err);
        });
      });
    }

    // Show overlay initially; user must click/tap to start fullscreen on many browsers
    startOverlay.addEventListener('pointerdown', startPlaybackAndFullscreen);
    // Also start on any user interaction (keydown, click)
    document.addEventListener('pointerdown', startPlaybackAndFullscreen, { once: true });
    document.addEventListener('keydown', startPlaybackAndFullscreen, { once: true });

    // If playback actually starts (some browsers allow autoplay muted), try to enter fullscreen
    videoPlayer.addEventListener('play', () => {
      if (!started) {
        // Some browsers require user gesture for fullscreen — this may fail silently
        enterFullscreen(videoPlayer).then(() => {
          started = true;
          startOverlay.style.display = 'none';
        }).catch(() => {
          // Do nothing; overlay remains for user to click
        });
      }
    });

    // (Removed periodic ad list fetch to use static local video files)
  </script>
</body>
</html>
